name: Build Windows x64

permissions:
  contents: read

on:
  push:
    branches:
      - ac3-audio
  workflow_dispatch:

jobs:
  build-windows-x64:
    uses: ./.github/workflows/ci-windows.yml
    with:
      amd64_only: true
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: '26.10.12'
