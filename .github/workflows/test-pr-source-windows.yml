name: Test PR source - Windows
permissions: {}

on:
  push:
    branches:
      - test/dolby-ac3-eac3-windows-rebuild

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows test build (pinned PR source)
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: 'e1554c3a28627a3161f6d5c99d396c6a55c96092'
      release_version: '0.0.0-test'

# Trigger a fresh run of the pinned-source test build.
