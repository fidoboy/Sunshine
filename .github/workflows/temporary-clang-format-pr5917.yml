name: Temporary clang-format check for Sunshine Dolby PR

on:
  push:
    branches:
      - 'test/clang-format-pr5917'

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pr/dolby-ac3-eac3

      - name: Initialize submodules needed by the locked Python tooling
        run: >-
          git submodule update --init --depth 1 --
          third-party/lizardbyte-common
          third-party/glad
          packaging/linux/flatpak/deps/flatpak-builder-tools

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          cache-dependency-glob: uv.lock

      - name: Sync locked Python tooling
        run: uv sync --locked

      - name: Run the repository clang-format updater
        run: uv run --locked lb-update-clang-format

      - name: Capture and summarize formatting changes
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/clang-format-result"
          git diff --binary > "${RUNNER_TEMP}/clang-format-result/clang-format.diff"
          git diff --name-only > "${RUNNER_TEMP}/clang-format-result/changed-files.txt"
          {
            echo "### clang-format validation"
            echo
            echo "Feature branch checked out:"
            git rev-parse HEAD
            echo
            if [[ -s "${RUNNER_TEMP}/clang-format-result/changed-files.txt" ]]; then
              echo "Files changed by the formatter:"
              echo ' ```text'
              cat "${RUNNER_TEMP}/clang-format-result/changed-files.txt"
              echo ' ```'
              echo
              echo "Diff summary:"
              git diff --stat
            else
              echo "No formatting changes were required."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::group::clang-format diff"
          git diff --unified=3
          echo "::endgroup::"

      - name: Upload formatter diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-format-diff
          path: ${{ runner.temp }}/clang-format-result/
          if-no-files-found: ignore
